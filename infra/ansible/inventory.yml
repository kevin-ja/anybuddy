# Inventario del deploy: una sola caja, alcanzada por SSM.

# anybuddy-app
#       │
#       │ instance_id
#       ▼
#    EC2
#       │
#       │ conexión
#       ▼
#     AWS SSM
#       │
#       ├── región: aws_region
#       │
#       └── S3: artifacts_bucket/ssm_transfer_prefix
#       │
#       ▼
#   comandos con sudo

all:
  hosts:
    anybuddy-app:
      ansible_host: "{{ instance_id }}"
      ansible_connection: amazon.aws.aws_ssm
      ansible_aws_ssm_region: "{{ aws_region }}"

      ansible_aws_ssm_bucket_name: "{{ artifacts_bucket }}"
      ansible_aws_ssm_bucket_prefix: "{{ ssm_transfer_prefix }}"

      ansible_become: true
