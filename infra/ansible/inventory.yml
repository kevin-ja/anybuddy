# Inventario del deploy: una sola caja, alcanzada por SSM.

# anybuddy-app
#       │
#       │ instance_id
#       ▼
#    EC2
#       │
#       │ conexión
#       ▼
#     AWS SSM
#       │
#       ├── región: aws_region
#       │
#       └── S3: artifacts_bucket/<instance_id>/
#       │
#       ▼
#   comandos con sudo

all:
  hosts:
    anybuddy-app:
      ansible_host: "{{ instance_id }}"
      ansible_connection: amazon.aws.aws_ssm
      ansible_aws_ssm_region: "{{ aws_region }}"

      # El conector arma la key como <instance_id>/<ruta_remota>. No hay opcion
      # para elegir el prefijo: la policy de IAM tiene que abrirse a "i-*/*".
      ansible_aws_ssm_bucket_name: "{{ artifacts_bucket }}"

      # El conector corta la sesion tras 60s SIN SALIDA (su default). El pull de
      # la imagen de api son ~6.5 GB y mientras baja una capa grande no imprime
      # nada, asi que el silencio se interpreta como caja caida. 30 min da aire
      # de sobra sin dejar un job colgado para siempre.
      ansible_aws_ssm_timeout: 1800

      ansible_become: true
