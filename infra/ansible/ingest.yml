---
- name: Correr la ingesta
  hosts: anybuddy-app
  gather_facts: true

  tasks:
    # ========================= COMPROBAR =========================

    - name: Verificar que llegaron los datos de la infra
      ansible.builtin.assert:
        that:
          - instance_id is defined and instance_id | length > 0
          - ecr_registry is defined and ecr_registry | length > 0
        fail_msg: >-
          Faltan instance_id y/o ecr_registry. Salen de `terraform output`.

    - name: Verificar que la caja ya tiene el .env.prod
      ansible.builtin.stat:
        path: "{{ app_dir }}/.env.prod"
      register: env_file

    # La ingesta no escribe el .env.prod, lo consume. Si no esta, es que nunca
    # corrio el deploy en esta caja.
    - name: Fallar si no hay .env.prod
      ansible.builtin.assert:
        that: env_file.stat.exists
        fail_msg: >-
          No existe {{ app_dir }}/.env.prod. Correr antes el workflow deploy.

    # ========================== INGESTAR =========================

    - name: Autenticar Docker contra ECR
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          aws ecr get-login-password --region {{ aws_region }} |
          docker login --username AWS --password-stdin {{ ecr_registry }}
        executable: /bin/bash
      changed_when: false

    - name: Bajar la imagen de ingestion
      ansible.builtin.command:
        cmd: docker pull {{ ecr_registry }}/anybuddy-ingestion:latest
      changed_when: true

    # Un contenedor de ingesta puede sobrevivir al workflow que lo lanzo: lo
    # maneja dockerd, no la sesion SSM, asi que si el job se corta el cliente
    # muere y el contenedor sigue. En una caja de 2 GB eso la deja sin aire y
    # hasta tumba al agente de SSM (paso el 17/08).
    #
    # Por eso el contenedor va con --name: sin nombre no hay forma de
    # encontrarlo despues. Esto lo mata antes de arrancar el nuevo.
    - name: Matar una ingesta huerfana de una corrida anterior
      ansible.builtin.command:
        cmd: docker rm -f {{ ingest_container }}
      register: orphan_kill
      changed_when: orphan_kill.rc == 0
      failed_when: false

    # Sin montar /data/chroma_storage a proposito: el contenedor arma el indice
    # adentro suyo y lo sube a S3. Tocar el indice vivo del host seria escribir
    # por debajo de Chroma mientras esta sirviendo.
    #
    # async + poll, y NO en primer plano. Vectorizar tarda ~20 min sin imprimir
    # nada, y Session Manager corta la sesion a los 20 min SIN TRAFICO. Al morir
    # la sesion se llevaba puesto el contenedor, porque era su proceso en primer
    # plano: la ingesta no fallaba, la mataban.
    #
    # Con async el contenedor queda suelto del canal SSM y Ansible pregunta cada
    # 30s como va. Ese ida y vuelta es el trafico que mantiene viva la sesion.
    # async 3600 = una hora de techo, holgado contra los ~20 min que tarda.
    - name: Vectorizar el knowledge base y publicarlo en S3
      ansible.builtin.command:
        cmd: >-
          docker run --rm --name {{ ingest_container }}
          --env-file {{ app_dir }}/.env.prod
          {{ ecr_registry }}/anybuddy-ingestion:latest
      register: ingest_run
      changed_when: true
      async: 3600
      poll: 30
      # No corta aca aunque falle: la ingesta son ~20 min y su salida es el
      # unico rastro de por que fallo. Si la tarea muere, el play se detiene y
      # esa salida no se imprime nunca. Se difiere el rojo hasta el final.
      failed_when: false

    - name: Borrar la imagen de ingestion
      ansible.builtin.command:
        cmd: docker rmi {{ ecr_registry }}/anybuddy-ingestion:latest
      changed_when: true
      failed_when: false

    # ========================== REVISAR ==========================

    - name: Mostrar la salida de la ingesta
      ansible.builtin.debug:
        msg: >-
          {{ ingest_run.stdout_lines | default([])
             + ingest_run.stderr_lines | default([]) }}

    - name: Leer el espacio libre en disco
      ansible.builtin.command:
        cmd: df -h /
      register: disk_free
      changed_when: false

    - name: Mostrar el disco
      ansible.builtin.debug:
        msg: "{{ disk_free.stdout_lines }}"

    # El rojo va ultimo, cuando la salida y el disco ya se imprimieron.
    - name: Fallar si la ingesta no termino bien
      ansible.builtin.assert:
        that: ingest_run.rc is defined and ingest_run.rc == 0
        fail_msg: >-
          La ingesta salio con rc={{ ingest_run.rc | default('desconocido') }}.
          El motivo esta en la salida de mas arriba.
