# Parámetros de configuración que irían en cada llamada a ansible-playbook
# los definimos aquí una vez para no repetirlos en cada corrida.

# Sin ansible.cfg — todo a mano:
# ANSIBLE_STDOUT_CALLBACK=default \
# ANSIBLE_CALLBACK_RESULT_FORMAT=yaml \
# ANSIBLE_PYTHON_INTERPRETER=auto_silent \
# ansible-playbook -i inventory.yml playbook.yml \
#   -e instance_id=i-02e3b9909787ab791 \
#   -e ecr_registry=176285591978.dkr.ecr.us-east-2.amazonaws.com

# Con ansible.cfg (lo que realmente corre este proyecto):
# ansible-playbook playbook.yml \
#   -e instance_id=i-02e3b9909787ab791 \
#   -e ecr_registry=176285591978.dkr.ecr.us-east-2.amazonaws.com


[defaults]
inventory          = inventory.yml
interpreter_python = auto_silent

# La salida en YAML ya no es un callback aparte: `stdout_callback = yaml`
# apuntaba a community.general.yaml, removido en la version 12 de esa
# coleccion. Ahora el callback por defecto la produce con result_format.
stdout_callback    = default
result_format      = yaml
