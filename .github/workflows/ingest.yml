name: ingest

# ============================================================================
# WORKFLOW DE INGESTA — ejecutar la imagen y producir el vector_db
# ============================================================================
# Objetivo:
#   Correr la imagen anybuddy-ingestion, vectorizar el knowledge base y
#   publicar el indice en s3://anybuddy-artifacts/vector_db/.
#
# Aca TERMINA en S3. Dejar ese indice sirviendo en la caja es trabajo de
# deploy-db-vector.yml, que arranca solo cuando este workflow termina bien.
#
# CORRE EN EL RUNNER, NO EN EL EC2 (cambiado el 19/08).
# Antes entraba al EC2 por SSM y lanzaba el contenedor ahi. No entraba: en los
# 2 GB de la caja conviven Chroma, la api con su reranker y el bot, y la
# ingesta cargando el modelo de embeddings los desbordaba. Se quedaba sin
# memoria, moria el agente de SSM y se llevaba puesto al bot (17 y 18/08).
# El runner tiene 16 GB para la ingesta sola y sale $0 porque el repo es
# publico. La caja de produccion ya no se toca durante la ingesta.
#
# Lo unico que cambio es DONDE corre el contenedor. La imagen se sigue
# construyendo igual, se sigue guardando en el mismo ECR y el indice sigue
# yendo al mismo bucket: build-ingest.yml y deploy-db-vector.yml no se enteran.
#
# ES MIXTO, automatico y manual, porque hay dos motivos para re-ingestar y son
# de naturaleza distinta:
#
#   - CAMBIO EL CODIGO -> automatico. El sistema ya sabe que cambio: el push
#     lo disparo, build-ingest.yml lo construyo y encadenar sale gratis.
#     Sin esto, la imagen nueva se queda en ECR sin ejecutarse y el bot sigue
#     respondiendo con un indice que produjo el codigo viejo.
#
#   - CAMBIO EL faqs.txt -> a mano. El que se entera es una persona, que va a
#     entrar igual a subir el archivo a S3. Apretar "Run workflow" no le cuesta
#     mas, y da log, historial y boton de reintento.
# ============================================================================

on:
  workflow_run:
    workflows: [build-ingest]
    types: [completed]
    branches: [main]

  workflow_dispatch:

# Ya NO comparte el grupo "ec2" con deploy-app y deploy-db-vector: este
# workflow dejo de entrar a la caja, asi que hacer fila con ellos solo lo
# demoraria sin motivo.
#
# Grupo propio igual: dos ingestas en paralelo escribirian el mismo
# chroma_storage.tar.gz en S3 y ganaria la que termine ultima, que no tiene por
# que ser la del codigo mas nuevo.
concurrency:
  group: ingest
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2

jobs:
  ingest:
    runs-on: ubuntu-latest

    # Vectorizar tarda ~15-20 min y bajar la imagen suma unos 3. El techo esta
    # para que un cuelgue no se coma horas de runner en silencio.
    timeout-minutes: 60

    # Si el build de la imagen fallo, no hay nada nuevo que ejecutar.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      id-token: write
      contents: read

    # Sin checkout a proposito: todo lo que se ejecuta viene adentro de la
    # imagen de ECR. El repo no hace falta para nada.
    steps:
      - name: Autenticar en AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # El mismo archivo que consume el contenedor en la caja. Aca no existe
      # porque el runner nace limpio en cada corrida, asi que se escribe del
      # secret y se borra al final.
      #
      # El secret entra por env y NO interpolado en el script: si el valor
      # trae una comilla, un $ o un salto raro, con ${{ }} el shell lo
      # interpretaria como codigo. Por env es un dato y nada mas.
      - name: Escribir el .env.prod
        env:
          ENV_PROD: ${{ secrets.ENV_PROD }}
        run: |
          set -euo pipefail
          printf '%s\n' "$ENV_PROD" > .env.prod
          chmod 600 .env.prod
          echo "Variables cargadas: $(grep -c '^[A-Z]' .env.prod)"

      # La imagen pesa ~3 GB comprimida (~7 descomprimida) y el runner no anda
      # sobrado de disco. Si algun dia falla el pull, el motivo se lee aca.
      - name: Ver el espacio en disco
        run: df -h /

      - name: Bajar la imagen de ingestion
        run: docker pull ${{ steps.login-ecr.outputs.registry }}/anybuddy-ingestion:latest

      # -----------------------------------------------------------------------
      # En primer plano y sin async: aca no hay sesion SSM que se corte a los
      # 20 min, asi que el contenedor puede tardar lo que tarde y su salida
      # llega derecho al log.
      #
      # Las credenciales van explicitas con -e. En el EC2 boto3 las descubria
      # solo por el rol de la instancia; adentro de un contenedor en el runner
      # no hay nada que descubrir, y sin esto la ingesta falla al bajar el
      # faqs.txt con NoCredentialsError.
      #
      # Sin montar nada: el contenedor arma el indice adentro suyo y lo sube a
      # S3. El disco del runner se tira a la basura cuando termina el job.
      # -----------------------------------------------------------------------
      - name: Vectorizar el knowledge base y publicarlo en S3
        run: |
          docker run --rm \
            --env-file .env.prod \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            ${{ steps.login-ecr.outputs.registry }}/anybuddy-ingestion:latest

      - name: Borrar el .env.prod
        if: always()
        run: rm -f .env.prod
