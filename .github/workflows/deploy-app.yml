name: deploy-app

# ============================================================================
# WORKFLOW DE DEPLOY — PLANO DE LA APP (api y bot)
# ============================================================================
# Objetivo:
#   Dejar el EC2 corriendo la version actual de api y bot, con Ansible.
#
# Aca no se compila nada: build-app.yml ya subio las imagenes a ECR. Se entra a
# la caja y se le dice que las baje y las levante.
#
# Este workflow es ademas el BOOTSTRAP de la caja: instala Docker, escribe
# /opt/anybuddy y deja el .env.prod. Por eso corre con las etiquetas
# "bootstrap,app". Es el que tiene que correr PRIMERO en un EC2 recien creado:
# deploy-db-vector.yml e ingest.yml dan por hecho que ya paso por aca.
# ============================================================================

on:
  # --------------------------------------------------------------------------
  # Se dispara CUANDO TERMINA el build, no con el push.
  #
  # Con "on: push" el deploy arrancaria EN PARALELO al build y desplegaria
  # imagenes a medio subir, o directamente las del commit anterior.
  #
  # OJO: workflow_run solo funciona si este archivo esta en la rama por
  # defecto (main). En una rama no se dispara, ni para probarlo.
  # --------------------------------------------------------------------------
  workflow_run:
    workflows: [build-app]
    types: [completed]
    branches: [main]

  # Permite lanzarlo a mano, sin tener que tocar codigo para forzar un
  # redeploy. Es tambien la forma de hacer el bootstrap de una caja nueva.
  workflow_dispatch:

# ============================================================================
# CONCURRENCIA
# ============================================================================
# Grupo "ec2", COMPARTIDO con deploy-db-vector.yml.
#
# Son dos workflows que entran a la misma caja, y es un t3.small con 2 GB de
# RAM y 20 GB de disco. Los dos a la vez se pisan los archivos de
# /opt/anybuddy: uno reescribe el .env.prod mientras el otro recrea un
# contenedor que lo esta leyendo. Con un solo grupo hacen fila en vez de
# chocar.
#
# ingest.yml estaba en este grupo hasta el 19/08. Salio cuando la ingesta se
# mudo al runner de GitHub: dejo de entrar a la caja, asi que esperar aca solo
# la demoraba.
#
# cancel-in-progress FALSE a proposito: cancelar un deploy a mitad de camino
# deja la caja a medio configurar (p.ej. el .env.prod nuevo escrito pero los
# contenedores todavia con la imagen vieja).
# ============================================================================
concurrency:
  group: ec2
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ARTIFACTS_BUCKET: anybuddy-artifacts
  # Tiene que coincidir con el backend de infra/terraform/providers.tf y con
  # var.tfstate_key. El bloque backend no admite variables, asi que el valor se
  # repite a mano en los tres lados.
  TFSTATE_KEY: tfstate/anybuddy.tfstate

jobs:
  # =========================================================================
  # HAY IMAGEN NUEVA?
  # =========================================================================
  # workflow_run avisa que build-app TERMINO, no que haya construido algo. Y
  # build-app corre por cambios que no producen imagen: sus paths incluyen
  # .github/actions/ec2-access/** y el propio build-app.yml. En ese caso el job
  # changes arma una matriz vacia, el job build queda skipped y el workflow
  # igual termina en success. Sin este guard, un comentario en la accion
  # disparaba un deploy entero (paso el 19/08).
  #
  # Como se sabe: se le preguntan los jobs de la corrida que disparo esta a la
  # API. Los outputs de un workflow_run no viajan en el evento, los jobs si.
  # Los del build se llaman "build (api, ...)" y "build (bot, ...)" por la
  # matriz, o "build" a secas cuando quedo skipped: alcanza con buscar alguno
  # que empiece con "build" y haya terminado en success.
  # =========================================================================
  guard:
    runs-on: ubuntu-latest

    permissions:
      # Para leer los jobs de la corrida que disparo esta. Nada mas.
      actions: read

    outputs:
      deploy: ${{ steps.check.outputs.deploy }}

    steps:
      - name: Ver si build-app construyo alguna imagen
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          # A mano no hay build previo que mirar: es el boton de "desplegar lo
          # que ya esta en ECR", util para recrear la caja sin tocar codigo.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Lanzado a mano: se despliega."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Si el build fallo o fue cancelado, no hay imagenes nuevas.
          if [ "$CONCLUSION" != "success" ]; then
            echo "build-app termino en '$CONCLUSION': no se despliega."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BUILT="$(gh api "/repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs"             --paginate             --jq '[.jobs[] | select(.name | startswith("build")) | .conclusion]
                  | any(. == "success")')"

          if [ "$BUILT" = "true" ]; then
            echo "build-app publico imagenes nuevas: se despliega."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "build-app no construyo nada (matriz vacia): no se despliega."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    runs-on: ubuntu-latest

    needs: guard
    if: needs.guard.outputs.deploy == 'true'

    permissions:
      # Para autenticarse con AWS por OIDC, sin access keys.
      id-token: write
      contents: read

    steps:
      # El repo se necesita por el playbook y por files/ (el compose y el
      # script que Ansible copia a la caja).
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Preparar el acceso al EC2
        id: ec2
        uses: ./.github/actions/ec2-access
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-arn: ${{ vars.AWS_ROLE_ARN }}
          artifacts-bucket: ${{ env.ARTIFACTS_BUCKET }}
          tfstate-key: ${{ env.TFSTATE_KEY }}

      # -----------------------------------------------------------------------
      # Etiquetas "bootstrap,app":
      #   bootstrap -> Docker, /opt/anybuddy, compose, .env.prod, login en ECR
      #   app       -> compose pull + up -d de los servicios
      #
      # NO lleva la etiqueta "vector-db": bajar el indice no es asunto de un
      # deploy de codigo, y hacerlo obligaria a reiniciar Chroma sin motivo.
      # La unica excepcion la resuelve el propio playbook: si la caja todavia
      # no tiene indice (primera corrida), lo baja igual.
      #
      # ENV_PROD va por VARIABLE DE ENTORNO y no por -e: los extra-vars quedan
      # visibles en la lista de procesos del runner.
      # -----------------------------------------------------------------------
      - name: Desplegar api y bot
        working-directory: infra/ansible
        env:
          ENV_PROD: ${{ secrets.ENV_PROD }}
          ANSIBLE_FORCE_COLOR: "1"
        run: |
          ansible-playbook playbook.yml \
            --tags bootstrap,app \
            -e instance_id=${{ steps.ec2.outputs.instance_id }} \
            -e ecr_registry=${{ steps.ec2.outputs.ecr_registry }}
